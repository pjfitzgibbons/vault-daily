<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Daily</title>
  <style>
    :root {
      --bg:      #1e1e1e;
      --bg2:     #252526;
      --bg3:     #2d2d30;
      --border:  #3e3e42;
      --text:    #cccccc;
      --dim:     #808080;
      --accent:  #007acc;
      --accentH: #1a8ad4;
      --done:    #4ec9b0;
      --warn:    #d4a017;
      --qa:      #c586c0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .spacer { flex: 1; }

    button {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      line-height: 1.4;
    }
    button:hover:not(:disabled) { background: #3e3e42; border-color: #999; }
    button:disabled { opacity: 0.35; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accentH); }

    #nav { display: flex; align-items: center; gap: 4px; }
    #current-date {
      font-weight: 600;
      min-width: 104px;
      text-align: center;
    }

    #status-bar {
      font-size: 11px;
      color: var(--dim);
      padding: 3px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Main grid ───────────────────────────────────── */
    #no-file-banner {
      display: none;
      background: rgba(212,160,23,.08);
      border-bottom: 1px solid rgba(212,160,23,.3);
      padding: 6px 12px;
      font-size: 12px;
      color: var(--warn);
      flex-shrink: 0;
    }
    #main {
      flex: 1;
      overflow: hidden;
      min-height: 0;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 5px 1fr;
      grid-template-rows: 1fr 5px 1fr;
      gap: 0;
    }
    @media (max-width: 760px) {
      #main { grid-template-columns: 1fr; grid-template-rows: auto 5px auto 5px auto; }
    }

    .section {
      overflow-y: auto;
      min-height: 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px 12px;
    }
    .section h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--dim);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    #section-standup { grid-column: 1; grid-row: 1; }
    #section-tasks   { grid-column: 3; grid-row: 1; }
    #section-notes   { grid-column: 1; grid-row: 3; }
    #section-ondeck  { grid-column: 3; grid-row: 3; }

    /* ── Splitters ───────────────────────────────────── */
    .splitter {
      position: relative;
      z-index: 5;
      background: var(--border);
      transition: background .12s;
    }
    .splitter::after {
      content: '';
      position: absolute;
      background: transparent;
      transition: background .12s;
    }
    .splitter-v {
      grid-column: 2;
      grid-row: 1 / span 3;
      cursor: col-resize;
    }
    .splitter-v::after {
      inset: 0 -4px;
    }
    .splitter-h {
      grid-column: 1 / span 3;
      grid-row: 2;
      cursor: row-resize;
      z-index: 6;
    }
    .splitter-h::after {
      inset: -4px 0;
    }
    .splitter:hover, .splitter.dragging {
      background: var(--accent);
    }

    /* ── Standup ─────────────────────────────────────── */
    .sf { margin-bottom: 9px; }
    .sf label {
      display: block;
      font-size: 11px;
      color: var(--dim);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .sf textarea, .sf input[type=text] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 3px;
    }
    .sf textarea { min-height: 56px; resize: vertical; }
    .sf textarea:focus, .sf input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* ── Task list ───────────────────────────────────── */
    .task-list { display: flex; flex-direction: column; gap: 3px; }
    .task-item {
      display: grid;
      grid-template-columns: 18px 74px 1fr 18px;
      align-items: baseline;
      gap: 0 7px;
      padding: 3px 5px;
      border-radius: 3px;
      line-height: 1.4;
    }
    .task-item:hover { background: var(--bg3); }
    .task-item:hover .task-delete { opacity: 1; }
    .task-item input[type=checkbox] {
      margin-top: 2px;
      cursor: pointer;
      justify-self: center;
      accent-color: var(--done);
    }
    .task-body {
      font-size: 13px;
      word-break: break-word;
      align-self: start;
    }
    .task-delete {
      opacity: 0;
      transition: opacity .12s;
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      padding: 0 2px;
      font-size: 14px;
      line-height: 1;
      align-self: start;
      margin-top: 1px;
    }
    .task-delete:hover { color: #f66 !important; opacity: 1 !important; }
    /* inline edit */
    .task-body {
      cursor: text;
    }
    .task-edit-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
      border-radius: 3px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 1px 6px;
      outline: none;
      width: 100%;
    }
    /* add-task row */
    .task-add-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .task-add-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 3px 7px;
      display: none;
    }
    .task-add-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .task-add-input.visible { display: block; }
    .btn-add-task {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .btn-add-task:hover { color: var(--text); background: var(--bg3); }
    .task-item.done .task-body { text-decoration: line-through; color: var(--dim); }
    .ticket-ref {
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,122,204,.13);
      padding: 1px 4px;
      border-radius: 2px;
    }
    /* ── Status badge + hover dropdown ───────────── */
    .task-status {
      position: relative;
      align-self: start;
      margin-top: 1px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      line-height: 1.4;
    }
    .task-item.done .status-badge {
      opacity: .35;
      pointer-events: none;
    }
    .status-badge .arrow {
      font-size: 8px;
      opacity: 0;
      transition: opacity .15s;
    }
    .task-item:hover .status-badge .arrow { opacity: .7; }

    .status-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 3px);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      z-index: 100;
      min-width: 110px;
      padding: 3px 0;
    }
    .status-menu.open { display: block; }
    .status-menu-item {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .status-menu-item:hover { background: rgba(255,255,255,.07); }
    .status-menu-item.active { opacity: .5; cursor: default; }
    .status-menu-item.active:hover { background: none; }

    .empty-state { font-size: 12px; color: var(--dim); font-style: italic; padding: 4px 0; }

    /* ── Notes ───────────────────────────────────────── */
    #notes-area {
      width: 100%;
      min-height: 60px;
      height: calc(100% - 34px);
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 8px;
      font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      border-radius: 3px;
      resize: vertical;
    }
    #notes-area:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .sec-footer { display: flex; gap: 6px; margin-top: 7px; }



    /* ── Toast ───────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 4px;
      font-size: 13px;
      z-index: 300;
      transition: opacity .35s;
      pointer-events: none;
    }
    .toast.ok  { border-color: var(--done); color: var(--done); }
    .toast.err { border-color: #f44; color: #f66; }

    /* ── Jira modal ──────────────────────────────────── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      width: 460px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 15px; margin-bottom: 14px; }
    .modal .mf { margin-bottom: 9px; }
    .modal .mf label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
    .modal .mf input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 3px;
      font-family: inherit;
    }
    .modal .mf input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .modal .hint { font-size: 11px; color: var(--dim); margin-top: 10px; }
    .modal .mactions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .modal hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  </style>
</head>
<body>

<div id="toolbar">
  <div id="nav">
    <button id="btn-prev">←</button>
    <button id="btn-today">Today</button>
    <span id="current-date">—</span>
    <button id="btn-next">→</button>
  </div>
  <div class="spacer"></div>
  <button id="btn-roll">↻ Roll Forward</button>
  <button id="btn-standup">☁ Standup</button>
  <button id="btn-save" disabled class="primary">Save</button>
</div>

<div id="status-bar">Loading…</div>
<div id="no-file-banner">No file for this date. Start editing to create it when you save.</div>

<div id="main">
  <div class="splitter splitter-v" id="split-v"></div>
  <div class="splitter splitter-h" id="split-h"></div>

  <div id="section-standup" class="section">
    <h2>Standup</h2>
    <div class="sf"><label>Yesterday</label><textarea id="standup-yesterday" placeholder="- item&#10;- item"></textarea></div>
    <div class="sf"><label>Today</label><textarea id="standup-today" placeholder="- item&#10;- item"></textarea></div>
    <div class="sf"><label>Blockers</label><input type="text" id="standup-blockers" placeholder="None"></div>
  </div>

  <div id="section-tasks" class="section">
    <h2>Tasks</h2>
    <div id="tasks-list" class="task-list"><div class="empty-state">—</div></div>
  </div>

  <div id="section-notes" class="section">
    <h2>Notes</h2>
    <textarea id="notes-area" spellcheck="false"></textarea>
    <div class="sec-footer">
      <button id="btn-time">⏱ Insert Time</button>
    </div>
  </div>

  <div id="section-ondeck" class="section">
    <h2>On Deck</h2>
    <div id="ondeck-list" class="task-list"><div class="empty-state">—</div></div>
  </div>
</div>

<!-- Jira modal -->
<div class="modal-backdrop" id="jira-backdrop">
  <div class="modal">
    <h3>Submit Standup to Jira</h3>
    <p style="font-size:13px;line-height:1.5;color:var(--text)">Jira credentials and field IDs are configured in <code style="background:var(--bg3);padding:1px 4px;border-radius:2px">config.json</code> at the vault root.</p>
    <p class="hint" style="margin-top:8px">The server proxies requests to Jira — no credentials are sent from the browser.</p>
    <div id="jira-status" style="margin-top:10px;font-size:12px"></div>
    <div class="mactions">
      <button id="j-cancel">Cancel</button>
      <button id="j-go" class="primary">Submit</button>
    </div>
  </div>
</div>

<script>'use strict';

// ── API ────────────────────────────────────────────────────────────────────────
async function apiGet(date) {
  const r = await fetch(`/api/daily/${date}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json(); // { date, content, exists }
}
async function apiPut(date, content) {
  const r = await fetch(`/api/daily/${date}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content }),
  });
  if (!r.ok) { const d = await r.json().catch(()=>({error:'Unknown'})); throw new Error(d.error||`HTTP ${r.status}`); }
  return r.json();
}
async function apiSubmitJira(payload) {
  const r = await fetch('/api/jira/standup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const d = await r.json().catch(()=>({error:'Unknown'}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

// ── Constants ──────────────────────────────────────────────────────────────────
const NOTES_PLACEHOLDER = '<!-- Cmd+; inserts the current time (HH:MM) at the cursor -->';

const STATUS_COLORS = {
  'wip': '#6b9bd2', 'reviewing': '#e5a550', 'in-review': '#d4a017',
  'needs-qa': '#c586c0', 'qa': '#c586c0', 'done': '#4ec9b0',
};
const STATUS_SLUGS     = new Set(Object.keys(STATUS_COLORS));
const SIMPLE_PREFIX_RE = /^([a-z][a-z0-9]*(?:-[a-z0-9]+)*)\s+/;
const TICKET_RE        = /\b([A-Z]+-\d+)\b/g;
const WIKILINK_RE      = /\[\[([^\]]+)\]\]/g;

// ── State ──────────────────────────────────────────────────────────────────────
let currentDate = todayStr();
let rawContent  = '';
let fileExists  = false;
let dirty       = false;

// ── Utility ────────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function addDays(s, n) {
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 2600);
}
function setStatus(msg) { document.getElementById('status-bar').textContent = msg; }

// ── File I/O via REST API ──────────────────────────────────────────────────────
async function loadDate(date) {
  if (dirty && !confirm('Unsaved changes — navigate away?')) return;
  currentDate = date;
  document.getElementById('current-date').textContent = date;
  rawContent = '';
  fileExists = false;
  try {
    const data = await apiGet(date);
    rawContent = data.content || '';
    fileExists = data.exists;
    setStatus(`daily/${date}.md${fileExists ? '' : ' (not found)'}`);
  } catch (e) {
    toast(`Load error: ${e.message}`, 'err');
    setStatus(`daily/${date}.md — load failed`);
  }
  dirty = false;
  updateSaveBtn();
  renderAll();
}

async function saveFile() {
  try {
    await apiPut(currentDate, buildContent());
    fileExists = true;
    dirty = false;
    updateSaveBtn();
    setStatus(`daily/${currentDate}.md`);
    document.getElementById('no-file-banner').style.display = 'none';
    toast('Saved', 'ok');
  } catch (e) { toast(`Save failed: ${e.message}`, 'err'); }
}

function markDirty() { dirty = true; updateSaveBtn(); }
function updateSaveBtn() {
  document.getElementById('btn-save').disabled = !dirty;
}

// ── Parsing ────────────────────────────────────────────────────────────────────
function parseSections(content) {
  const lines = String(content || '').split(/\r?\n/);
  let i = 0, frontmatter = '', titleLine = '';

  if (lines[0] === '---') {
    const end = lines.indexOf('---', 1);
    if (end > 0) { frontmatter = lines.slice(0, end+1).join('\n'); i = end+1; }
  }

  const order    = [];
  const sections = {};  // name -> string[]
  let cur = null;

  for (; i < lines.length; i++) {
    const h1 = /^#\s+/.exec(lines[i]);
    if (h1 && !titleLine) { titleLine = lines[i]; continue; }

    const h2 = /^##\s+(.+)/.exec(lines[i]);
    if (h2) {
      cur = h2[1].trim();
      if (!sections[cur]) { order.push(cur); sections[cur] = []; }
      continue;
    }
    if (cur !== null) sections[cur].push(lines[i]);
  }

  return { frontmatter, titleLine, order, sections };
}

function parseStandup(lines) {
  const r = { yesterday: [], today: [], blockers: '' };
  let key = null;
  const MAP = { 'yesterday:': 'yesterday', 'today:': 'today', 'blockers:': 'blockers' };

  for (const line of lines) {
    const bold = /^\*\*([^*]+)\*\*\s*(.*)$/.exec(line.trim());
    if (bold) {
      const k = MAP[bold[1].trim().toLowerCase()];
      if (k) {
        key = k;
        const inline = bold[2].trim();
        if (inline && k === 'blockers') r.blockers = inline;
        continue;
      }
    }
    if (key === 'yesterday' || key === 'today') {
      const m = /^\s*-\s+(.+)/.exec(line);
      if (m) r[key].push(m[1].trim());
    } else if (key === 'blockers') {
      const m = /^\s*-\s+(.+)/.exec(line);
      if (m) r.blockers = (r.blockers ? r.blockers+', ' : '') + m[1].trim();
    }
  }
  return r;
}

/** For display: parse tasks into { raw, done, body, status } objects. */
function parseTaskLines(lines) {
  return (lines || []).flatMap(line => {
    const done = /^\s*-\s*\[x\]\s*(.+)/i.exec(line);
    if (done) return [{ raw: line, done: true,  body: done[1].trim(), status: 'done' }];
    const todo = /^\s*-\s*\[ \]\s*(.+)/.exec(line);
    if (todo) {
      const body = todo[1].trim();
      const pm   = SIMPLE_PREFIX_RE.exec(body);
      const stat = (pm && STATUS_SLUGS.has(pm[1])) ? pm[1] : 'wip';
      const clean = stat !== 'wip' ? body.slice(pm[0].length) : body;
      return [{ raw: line, done: false, body: clean, status: stat }];
    }
    return [];
  });
}

/** For roll-forward: raw body text after the checkbox. */
function parseRawTasks(lines) {
  const completed = [], remaining = [];
  for (const line of (lines || [])) {
    const done = /^\s*-\s*\[x\]\s*(.+)/i.exec(line);
    if (done) { completed.push(done[1].trim()); continue; }
    const todo = /^\s*-\s*\[ \]\s*(.+)/.exec(line);
    if (todo) remaining.push(todo[1].trim());
  }
  return { completed, remaining };
}

// ── Rendering ──────────────────────────────────────────────────────────────────
function renderAll() {
  document.getElementById('no-file-banner').style.display = fileExists ? 'none' : 'block';

  if (!rawContent) {
    document.getElementById('standup-yesterday').value = '';
    document.getElementById('standup-today').value     = '';
    document.getElementById('standup-blockers').value  = '';
    renderTaskList('tasks-list',  []);
    renderTaskList('ondeck-list', []);
    document.getElementById('notes-area').value        = NOTES_PLACEHOLDER;
    return;
  }

  const { sections } = parseSections(rawContent);
  const sd = parseStandup(sections['Standup'] || []);

  document.getElementById('standup-yesterday').value =
    sd.yesterday.map(s => `- ${s}`).join('\n');
  document.getElementById('standup-today').value =
    sd.today.map(s => `- ${s}`).join('\n');
  document.getElementById('standup-blockers').value = sd.blockers;

  renderTaskList('tasks-list',  parseTaskLines(sections['Tasks']    || []));
  renderTaskList('ondeck-list', parseTaskLines(sections['On Deck']  || []));

  document.getElementById('notes-area').value =
    (sections['Notes'] || []).join('\n').trimEnd();
}

const STATUS_LIST = [
  { slug: 'wip',       label: 'WIP'       },
  { slug: 'in-review', label: 'In-Review' },
  { slug: 'reviewing', label: 'Reviewing' },
  { slug: 'needs-qa',  label: 'Needs-QA'  },
  { slug: 'qa',        label: 'QA'        },
  { slug: 'done',      label: 'Done'      },
];

function renderTaskList(id, tasks) {
  const container = document.getElementById(id);
  const sectionName = id === 'tasks-list' ? 'Tasks' : 'On Deck';
  container.innerHTML = '';

  for (const task of tasks) {
    container.appendChild(buildTaskRow(task, sectionName));
  }

  // ── Add row ──
  const addRow = document.createElement('div');
  addRow.className = 'task-add-row';

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-task';
  addBtn.textContent = '+ Add';

  const addInput = document.createElement('input');
  addInput.type = 'text';
  addInput.className = 'task-add-input';
  addInput.placeholder = 'New task…';

  const commit = () => {
    const text = addInput.value.trim();
    addInput.value = '';
    addInput.classList.remove('visible');
    addBtn.style.display = '';
    if (!text) return;
    addTaskToSection(sectionName, text);
    renderAll();
    markDirty();
  };

  addBtn.addEventListener('click', () => {
    addBtn.style.display = 'none';
    addInput.classList.add('visible');
    addInput.focus();
  });
  addInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') {
      addInput.value = '';
      addInput.classList.remove('visible');
      addBtn.style.display = '';
    }
  });
  addInput.addEventListener('blur', commit);

  addRow.appendChild(addBtn);
  addRow.appendChild(addInput);
  container.appendChild(addRow);
}

function buildTaskRow(task, sectionName) {
    const row = document.createElement('div');
    row.className = 'task-item' + (task.done ? ' done' : '');

    const cb = document.createElement('input');
    cb.type    = 'checkbox';
    cb.checked = task.done;
    cb.addEventListener('change', () => {
      const newSlug = cb.checked ? 'done' : 'wip';
      const oldRaw  = task.raw;
      const newRaw  = rewriteTaskStatus(oldRaw, newSlug);
      rawContent    = rawContent.replace(oldRaw, newRaw);
      task.raw      = newRaw;
      task.done     = cb.checked;
      task.status   = newSlug;
      row.classList.toggle('done', cb.checked);
      badge.style.color = STATUS_COLORS[newSlug];
      badge.querySelector('.label').textContent = cb.checked ? 'Done' : 'WIP';
      menu.querySelectorAll('.status-menu-item').forEach((el, i) => {
        el.classList.toggle('active', STATUS_LIST[i].slug === newSlug);
      });
      markDirty();
    });

    const bodyEl = document.createElement('span');
    bodyEl.className = 'task-body';
    bodyEl.innerHTML = fmtBody(task.body);
    bodyEl.title = 'Click to edit';

    bodyEl.addEventListener('click', e => {
      e.stopPropagation();
      const origBody = task.body;
      // swap span → input
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-edit-input';
      input.value = task.body;
      bodyEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        const newText = input.value.trim() || origBody;
        if (newText !== origBody) {
          // Rebuild raw line: preserve checkbox state + status prefix
          const indent = /^(\s*)/.exec(task.raw)[1];
          const cb_str = task.done ? '[x]' : '[ ]';
          const prefix = (task.status !== 'wip' && task.status !== 'done') ? task.status + ' ' : '';
          const newRaw = `${indent}- ${cb_str} ${prefix}${newText}`;
          rawContent = rawContent.replace(task.raw, newRaw);
          task.raw  = newRaw;
          task.body = newText;
          markDirty();
        }
        bodyEl.innerHTML = fmtBody(task.body);
        input.replaceWith(bodyEl);
      };

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { input.value = origBody; commit(); }
      });
      input.addEventListener('blur', commit);
    });

    // ── Status badge + dropdown ──
    const statusWrap = document.createElement('div');
    statusWrap.className = 'task-status';

    const badge = document.createElement('span');
    badge.className = 'status-badge';
    badge.style.color = STATUS_COLORS[task.status] || STATUS_COLORS['wip'];
    badge.innerHTML = `<span class="label">${STATUS_LIST.find(s=>s.slug===task.status)?.label ?? 'WIP'}</span><span class="arrow">▾</span>`;

    const menu = document.createElement('div');
    menu.className = 'status-menu';

    for (const s of STATUS_LIST) {
      const item = document.createElement('div');
      item.className = 'status-menu-item' + (s.slug === task.status ? ' active' : '');
      item.textContent = s.label;
      item.style.color = STATUS_COLORS[s.slug];
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        if (s.slug === task.status) return;
        const oldRaw = task.raw;
        const newRaw = rewriteTaskStatus(oldRaw, s.slug);
        rawContent = rawContent.replace(oldRaw, newRaw);
        task.raw    = newRaw;
        task.status = s.slug;
        task.done   = s.slug === 'done';
        cb.checked  = task.done;
        row.classList.toggle('done', task.done);
        badge.style.color = STATUS_COLORS[s.slug];
        badge.querySelector('.label').textContent = s.label;
        menu.querySelectorAll('.status-menu-item').forEach((el, i) => {
          el.classList.toggle('active', STATUS_LIST[i].slug === s.slug);
        });
        menu.classList.remove('open');
        markDirty();
      });
      menu.appendChild(item);
    }

    badge.addEventListener('click', e => {
      if (task.done) return;
      e.stopPropagation();
      const wasOpen = menu.classList.contains('open');
      document.querySelectorAll('.status-menu.open').forEach(m => m.classList.remove('open'));
      if (!wasOpen) menu.classList.add('open');
    });

    statusWrap.appendChild(badge);
    statusWrap.appendChild(menu);

    // ── Delete button ──
    const del = document.createElement('button');
    del.className = 'task-delete';
    del.title = 'Delete task';
    del.textContent = '×';
    del.addEventListener('click', () => {
      deleteTaskFromSection(task.raw);
      row.remove();
      markDirty();
    });

    row.appendChild(cb);
    row.appendChild(statusWrap);
    row.appendChild(bodyEl);
    row.appendChild(del);
    return row;
}

function fmtBody(text) {
  let s = escHtml(text);
  s = s.replace(/\[\[([^\]]+)\]\]/g, '$1');           // strip wikilinks
  s = s.replace(/\b([A-Z]+-\d+)\b/g,
    '<span class="ticket-ref">$1</span>');
  return s;
}

/**
 * Insert a new task line into the named section of rawContent.
 * Adds before any trailing blank lines / link refs at the end of the section.
 */
function addTaskToSection(sectionName, text) {
  const newLine = `- [ ] ${text}`;
  const lines = rawContent.split(/\r?\n/);
  let inSection = false;
  let insertAt = -1;

  for (let i = 0; i < lines.length; i++) {
    const h2 = /^##\s+(.+)/.exec(lines[i]);
    if (h2) {
      if (inSection) { insertAt = i; break; }  // hit next section
      inSection = h2[1].trim() === sectionName;
      continue;
    }
    if (inSection) {
      // Track last non-blank task/content line
      if (lines[i].trim()) insertAt = i + 1;
    }
  }
  // If section ends at EOF
  if (inSection && insertAt === -1) insertAt = lines.length;

  if (insertAt === -1) return; // section not found
  lines.splice(insertAt, 0, newLine);
  rawContent = lines.join('\n');
}

/** Remove an exact raw line from rawContent. */
function deleteTaskFromSection(rawLine) {
  const lines = rawContent.split(/\r?\n/);
  const idx = lines.indexOf(rawLine);
  if (idx !== -1) lines.splice(idx, 1);
  rawContent = lines.join('\n');
}


function rewriteTaskStatus(lineText, newSlug) {
  const indent = /^(\s*)/.exec(lineText)[1];
  const body   = /^\s*-\s*\[[x ]\]\s*(.+)$/i.exec(lineText);
  if (!body) return lineText;
  let text = body[1];
  // Strip any existing status prefix
  const pm = SIMPLE_PREFIX_RE.exec(text);
  if (pm && STATUS_SLUGS.has(pm[1])) text = text.slice(pm[0].length);
  if (newSlug === 'done') return `${indent}- [x] ${text}`;
  if (newSlug === 'wip')  return `${indent}- [ ] ${text}`;
  return `${indent}- [ ] ${newSlug} ${text}`;
}

// ── Content mutation ───────────────────────────────────────────────────────────

// ── Content builder ────────────────────────────────────────────────────────────
/**
 * Scans rawContent line-by-line and replaces the Standup and Notes sections
 * with the current UI field values, preserving everything else verbatim.
 */
function buildContent() {
  // If no existing content, build from scratch.
  if (!rawContent) return buildFreshContent(currentDate);

  const lines = rawContent.split(/\r?\n/);
  const out   = [];
  let skip = false;

  for (let i = 0; i < lines.length; i++) {
    const h2 = /^##\s+(.+)/.exec(lines[i]);
    if (h2) {
      const name = h2[1].trim();
      if (name === 'Standup') {
        out.push(lines[i]);
        out.push(...buildStandupLines());
        out.push('');
        skip = true;
        continue;
      }
      if (name === 'Notes') {
        out.push(lines[i]);
        const notesVal = document.getElementById('notes-area').value;
        out.push(...notesVal.split('\n'));
        skip = true;
        continue;
      }
      skip = false;
      // fall-through: push the heading line
    }
    if (skip) continue;
    out.push(lines[i]);
  }

  return out.join('\n');
}

function buildStandupLines() {
  const norm = val => {
    return val.split('\n')
      .map(l => l.trim()).filter(Boolean)
      .map(l => l.startsWith('-') ? l : `- ${l}`);
  };
  const y = norm(document.getElementById('standup-yesterday').value);
  const t = norm(document.getElementById('standup-today').value);
  const b = document.getElementById('standup-blockers').value.trim() || '';
  return [
    '**Yesterday:**', ...y,
    '**Today:**',     ...t,
    `**Blockers:** ${b}`,
  ];
}

function buildFreshContent(date) {
  return [
    '---', `date: ${date}`, '---', '',
    `# ${date}`, '',
    '## Standup',
    ...buildStandupLines(), '',
    '## Tasks', '- [ ] ', '',
    '## On Deck', '- ', '',
    '## Notes', NOTES_PLACEHOLDER, '',
  ].join('\n');
}

// ── Roll Forward ───────────────────────────────────────────────────────────────
function transformForStandup(text, addContinuing) {
  const tickets = [...text.matchAll(TICKET_RE)].map(m => m[1]);
  let c = text
    .replace(/\b[A-Z]+-\d+(?:\s*\/\s*[A-Z]+-\d+)*\s*-\s*/g, '')
    .replace(/\s*\/\s*\b[A-Z]+-\d+\b/g, '')
    .replace(/\b[A-Z]+-\d+\b/g, '')
    .replace(/^\s*-\s*/, '').replace(/\s*-\s*$/, '')
    .replace(/\s{2,}/g, ' ').trim()
    .replace(WIKILINK_RE, '$1');
  const suf  = tickets.length ? ` (${tickets.join(', ')})` : '';
  const pm   = SIMPLE_PREFIX_RE.exec(c);
  if (pm && STATUS_SLUGS.has(pm[1])) {
    return `${pm[1]}: ${c.slice(pm[0].length).trim()}${suf}`;
  }
  return addContinuing ? `Continuing ${c}${suf}` : `${c}${suf}`;
}

async function rollForward() {
  const nextDate = addDays(currentDate, 1);

  try {
    const check = await apiGet(nextDate);
    if (check.exists) { toast(`${nextDate}.md already exists`, 'err'); return; }
  } catch (e) { toast(`Roll error: ${e.message}`, 'err'); return; }

  if (dirty) await saveFile();

  const { sections } = parseSections(rawContent);
  const { completed, remaining } = parseRawTasks(sections['Tasks'] || []);

  const yesterday = completed.map(t => `- ${transformForStandup(t, false)}`).join('\n') || '';
  const today     = remaining.map(t => `- ${transformForStandup(t, true)}`).join('\n')  || '';
  const tasks     = remaining.length ? remaining.map(r => `- [ ] ${r}`).join('\n') : '- [ ] ';
  const onDeck    = (sections['On Deck'] || [])
    .filter(l => l.trim()).join('\n') || '- ';

  const content = [
    '---', `date: ${nextDate}`, '---', '',
    `# ${nextDate}`, '',
    '## Standup',
    '**Yesterday:**', ...(yesterday ? yesterday.split('\n') : ['']),
    '**Today:**',     ...(today     ? today.split('\n')     : ['']),
    '**Blockers:** ', '',
    '## Tasks', ...tasks.split('\n'), '',
    '## On Deck', ...onDeck.split('\n'), '',
    '## Notes', NOTES_PLACEHOLDER, '',
  ].join('\n');

  try {
    await apiPut(nextDate, content);
    toast(`Created ${nextDate}.md`, 'ok');
    await loadDate(nextDate);
  } catch (e) { toast(`Roll failed: ${e.message}`, 'err'); }
}

// ── Timestamp insert ───────────────────────────────────────────────────────────
function insertTime() {
  const ta  = document.getElementById('notes-area');
  const now = new Date();
  const ts  = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const pos = ta.selectionStart;
  const val = ta.value;
  const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
  const lineText  = val.slice(lineStart, pos);
  const insert    = lineText.trim() === '' ? ts + ' ' : '\n' + ts + ' ';
  const newVal    = val.slice(0, pos) + insert + val.slice(pos);
  ta.value = newVal;
  ta.setSelectionRange(pos + insert.length, pos + insert.length);
  ta.focus();
  markDirty();
}

// ── Jira ───────────────────────────────────────────────────────────────────────
function showJiraModal() {
  document.getElementById('jira-status').textContent = '';
  document.getElementById('jira-backdrop').classList.add('open');
}

async function submitStandup() {
  const { sections } = parseSections(rawContent);
  const sd = parseStandup(sections['Standup'] || []);
  const statusEl = document.getElementById('jira-status');
  statusEl.style.color = 'var(--dim)';
  statusEl.textContent = 'Submitting…';
  try {
    const result = await apiSubmitJira({
      date: currentDate,
      yesterday: sd.yesterday,
      today: sd.today,
      blockers: sd.blockers,
    });
    statusEl.style.color = 'var(--done)';
    statusEl.textContent = `${result.key} updated${result.transitioned ? ' & marked Done' : ''} ✓`;
    toast(`${result.key} submitted`, 'ok');
  } catch (e) {
    statusEl.style.color = '#f66';
    statusEl.textContent = e.message;
    toast(`Jira: ${e.message}`, 'err');
  }
}

document.getElementById('btn-prev').addEventListener('click', () => loadDate(addDays(currentDate,-1)));
document.getElementById('btn-next').addEventListener('click', () => loadDate(addDays(currentDate, 1)));
document.getElementById('btn-today').addEventListener('click', () => loadDate(todayStr()));

document.getElementById('btn-time').addEventListener('click', insertTime);

['standup-yesterday','standup-today','standup-blockers','notes-area']
  .forEach(id => document.getElementById(id).addEventListener('input', markDirty));

document.getElementById('j-cancel').addEventListener('click', () =>

document.getElementById('j-go').addEventListener('click', async () => {

});
document.getElementById('jira-backdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('jira-backdrop'))
    document.getElementById('jira-backdrop').classList.remove('open');
});

// Close any open status menu on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.status-menu.open').forEach(m => m.classList.remove('open'));
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 's') { e.preventDefault(); if (dirty) saveFile(); }
  if (mod && e.key === ';') { e.preventDefault(); insertTime(); }
  if (e.key === 'Escape') document.getElementById('jira-backdrop').classList.remove('open');
});

// ── Splitters ───────────────────────────────────────────────────────────────
function loadSplitterState() {
  const main = document.getElementById('main');
  const c = localStorage.getItem('splitCols');
  const r = localStorage.getItem('splitRows');
  if (c) main.style.gridTemplateColumns = `${c} 5px 1fr`;
  if (r) main.style.gridTemplateRows    = `${r} 5px 1fr`;
}
function saveSplitterState() {
  const cs = getComputedStyle(document.getElementById('main'));
  localStorage.setItem('splitCols', cs.gridTemplateColumns.split(' ')[0]);
  localStorage.setItem('splitRows', cs.gridTemplateRows.split(' ')[0]);
}

function initSplitters() {
  const main = document.getElementById('main');

  function makeDrag(splitterId, axis) {
    document.getElementById(splitterId).addEventListener('mousedown', e => {
      e.preventDefault();
      const cs     = getComputedStyle(main);
      const tracks = axis === 'x'
        ? cs.gridTemplateColumns.split(' ').map(parseFloat)
        : cs.gridTemplateRows.split(' ').map(parseFloat);
      const start   = axis === 'x' ? e.clientX : e.clientY;
      const startPx = tracks[0];
      const avail   = tracks[0] + tracks[2];
      const el      = document.getElementById(splitterId);
      el.classList.add('dragging');
      document.body.style.cursor     = axis === 'x' ? 'col-resize' : 'row-resize';
      document.body.style.userSelect = 'none';

      const onMove = e => {
        const delta  = (axis === 'x' ? e.clientX : e.clientY) - start;
        const newPx  = Math.max(120, Math.min(avail - 120, startPx + delta));
        if (axis === 'x') main.style.gridTemplateColumns = `${newPx}px 5px 1fr`;
        else              main.style.gridTemplateRows    = `${newPx}px 5px 1fr`;
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        el.classList.remove('dragging');
        document.body.style.cursor     = '';
        document.body.style.userSelect = '';
        saveSplitterState();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  makeDrag('split-v', 'x');
  makeDrag('split-h', 'y');
}

// ── Init ───────────────────────────────────────────────────────────────
document.getElementById('current-date').textContent = currentDate;
loadSplitterState();
initSplitters();
loadDate(currentDate);
